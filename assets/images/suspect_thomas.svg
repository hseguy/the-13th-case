<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#5a451b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="noirGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="380" fill="url(#vignette)"/>
  
  <!-- Outer Vintage Frame -->
  <rect x="8" y="8" width="304" height="364" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="352" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Character Artwork -->
  <g filter="url(#noirGlow)">
      <!-- Torso & Suit -->
  <path d="M60,315 C75,240 100,210 120,200 L120,180 L200,180 L200,200 C220,210 245,240 260,315 Z" fill="#15181c"/>
  <!-- Head & Jaw -->
  <path d="M122,120 C122,80 135,65 160,65 C185,65 198,80 198,120 C198,165 185,185 160,185 C135,185 122,165 122,120 Z" fill="#cbb094"/>
  <!-- Slicked Side-Part Hair -->
  <path d="M118,105 C118,75 135,55 165,55 C195,55 202,75 202,100 C190,80 170,75 145,78 C130,80 122,95 118,105 Z" fill="#1e1815"/>
  <!-- Shadow (Dramatic side light) -->
  <path d="M122,120 C122,165 135,185 160,185 C148,175 142,145 142,110 C142,85 152,70 160,65 C135,65 122,80 122,120 Z" fill="#7a5e45" opacity="0.6"/>
  <!-- Stern Brow, Eyes, Mustache -->
  <line x1="135" y1="115" x2="152" y2="118" stroke="#1e1815" stroke-width="2.5"/>
  <line x1="168" y1="118" x2="185" y2="115" stroke="#1e1815" stroke-width="2.5"/>
  <ellipse cx="144" cy="123" rx="3.5" ry="2" fill="#1e1815"/>
  <ellipse cx="176" cy="123" rx="3.5" ry="2" fill="#1e1815"/>
  <path d="M148,152 Q160,147 172,152" stroke="#2a1e17" stroke-width="3" fill="none"/>
  <!-- Formal Collared Shirt & Burgundy Tie -->
  <polygon points="160,185 145,215 160,315 175,215" fill="#8b3a3a"/>
  <polygon points="135,180 150,215 125,225" fill="#f5e6c8"/>
  <polygon points="185,180 170,215 195,225" fill="#f5e6c8"/>
  <!-- Pinstripe Lapels -->
  <path d="M110,210 L145,280 L130,315" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  <path d="M210,210 L175,280 L190,315" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  </g>

  <!-- Bottom Name Plate -->
  <rect x="20" y="315" width="280" height="46" fill="rgba(10,9,8,0.92)" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <text x="160" y="335" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#dfbf67" text-anchor="middle" letter-spacing="2">THOMAS REED</text>
  <text x="160" y="351" font-family="'Special Elite', monospace" font-size="9.5" fill="#a09880" text-anchor="middle" letter-spacing="1.5">PARTNER • FINANCIAL MOTIVE</text>
  
  <!-- Corner Ornaments -->
  <circle cx="14" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="14" cy="366" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="366" r="3" fill="#c9a84c"/>
</svg>