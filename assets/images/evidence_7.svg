  </defs>

  <rect width="260" height="200" fill="url(#clueBg)"/>
  <rect x="6" y="6" width="248" height="188" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>
  <rect x="10" y="10" width="240" height="180" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.8" stroke-dasharray="4,2"/>

  <!-- Evidence Artwork -->
  <g transform="translate(0, -10)">
      <!-- Dark Amber Bottle -->
  <rect x="110" y="60" width="40" height="65" rx="4" fill="#381818" stroke="#8b3a3a" stroke-width="1.5"/>
  <rect x="122" y="45" width="16" height="15" fill="#201010" stroke="#8b3a3a" stroke-width="1.5"/>
  <ellipse cx="130" cy="45" rx="10" ry="3" fill="#8b3a3a"/>
  <!-- Skull Label -->
  <rect x="115" y="75" width="30" height="35" fill="#f5e6c8" stroke="#111" stroke-width="0.8"/>
  <circle cx="130" cy="88" r="6" fill="#111"/>
  <ellipse cx="128" cy="87" rx="1.5" ry="1.5" fill="#f5e6c8"/>
