  <text x="130" y="104" font-size="6" font-family="monospace" fill="#8b3a3a" text-anchor="middle" font-weight="bold">ARSENIC</text>
  </g>

  <!-- Tag & Clue Label -->
  <rect x="15" y="152" width="230" height="35" fill="rgba(10,8,7,0.92)" stroke="url(#goldRim)" stroke-width="1"/>
  <text x="25" y="167" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="#dfbf67">#7: POISON BOTTLE</text>
  <text x="25" y="180" font-family="'Special Elite', monospace" font-size="8" fill="#a09880" letter-spacing="1">HIGH • PLANTED RED HERRING</text>
