<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#5a451b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="noirGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="380" fill="url(#vignette)"/>
  
  <!-- Outer Vintage Frame -->
  <rect x="8" y="8" width="304" height="364" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="352" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Character Artwork -->
  <g filter="url(#noirGlow)">
      <!-- Dark Wool Suit -->
  <path d="M60,315 C75,235 100,205 120,195 L120,175 L200,175 L200,195 C220,205 245,235 260,315 Z" fill="#101114"/>
  <!-- Head & Narrow Jaw -->
  <path d="M125,115 C125,75 138,62 160,62 C182,62 195,75 195,115 C195,165 180,185 160,185 C140,185 125,165 125,115 Z" fill="#c5ab90"/>
  <!-- Dark Noir Shadow Half Face -->
  <path d="M125,115 C125,165 140,185 160,185 C148,170 142,140 142,105 C142,80 152,65 160,62 C138,62 125,75 125,115 Z" fill="#584332" opacity="0.75"/>
  <!-- Slick Black Hair -->
  <path d="M120,95 C120,68 135,50 160,50 C185,50 200,68 200,95 C190,75 175,70 160,70 C145,70 130,75 120,95 Z" fill="#0d0d0f"/>
  <!-- Round Spectacles & Cold Eyes -->
  <circle cx="144" cy="118" r="8" fill="none" stroke="#c9a84c" stroke-width="1.8"/>
  <circle cx="176" cy="118" r="8" fill="none" stroke="#c9a84c" stroke-width="1.8"/>
  <line x1="152" y1="118" x2="168" y2="118" stroke="#c9a84c" stroke-width="1.8"/>
  <ellipse cx="144" cy="118" rx="3.5" ry="1.8" fill="#000"/>
  <ellipse cx="176" cy="118" rx="3.5" ry="1.8" fill="#000"/>
  <!-- Thin Pencil Mustache & Subtle Smirk -->
  <path d="M148,145 Q160,142 172,145" stroke="#111" stroke-width="2.5" fill="none"/>
  <path d="M152,158 Q160,156 168,161" stroke="#4a3022" stroke-width="2" fill="none"/>
  <!-- Silk Dark Tie & Red Carnation Lapel -->
  <polygon points="160,180 150,210 160,315 170,210" fill="#181822"/>
  <polygon points="135,175 152,210 125,220" fill="#f0ebd8"/>
  <polygon points="185,175 168,210 195,220" fill="#f0ebd8"/>
  <circle cx="122" cy="235" r="5" fill="#8b3a3a"/>
  <!-- Cigarette Smoke Wisp -->
  <path d="M172,175 Q185,150 180,130 Q175,110 190,90" stroke="rgba(245,230,200,0.3)" stroke-width="2" fill="none"/>
  </g>

  <!-- Bottom Name Plate -->
  <rect x="20" y="315" width="280" height="46" fill="rgba(10,9,8,0.92)" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <text x="160" y="335" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#dfbf67" text-anchor="middle" letter-spacing="2">VICTOR GRAVES</text>
  <text x="160" y="351" font-family="'Special Elite', monospace" font-size="9.5" fill="#a09880" text-anchor="middle" letter-spacing="1.5">LAWYER • THE KILLER</text>
  
  <!-- Corner Ornaments -->
  <circle cx="14" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="14" cy="366" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="366" r="3" fill="#c9a84c"/>
</svg>