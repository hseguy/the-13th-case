<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200">
  <defs>
    <radialGradient id="clueBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241d17"/>
      <stop offset="60%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#080705"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#604a18"/>
    </linearGradient>
  </defs>

  <rect width="260" height="200" fill="url(#clueBg)"/>
  <rect x="6" y="6" width="248" height="188" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>
  <rect x="10" y="10" width="240" height="180" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.8" stroke-dasharray="4,2"/>

  <!-- Evidence Artwork -->
  <g transform="translate(0, -10)">
      <!-- Tumbler Rim Base -->
  <ellipse cx="130" cy="105" rx="35" ry="12" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Broken Shards -->
  <polygon points="100,75 125,50 115,85" fill="rgba(245,230,200,0.5)" stroke="#c9a84c" stroke-width="1"/>
  <polygon points="135,55 160,80 145,95" fill="rgba(245,230,200,0.4)" stroke="#c9a84c" stroke-width="1"/>
  <polygon points="110,95 130,115 95,110" fill="rgba(245,230,200,0.6)" stroke="#c9a84c" stroke-width="1"/>
  <polygon points="150,90 175,100 160,118" fill="rgba(245,230,200,0.5)" stroke="#c9a84c" stroke-width="1"/>
  <!-- Amber Bourbon Drop Spills -->
  <ellipse cx="132" cy="108" rx="20" ry="6" fill="#a66e28" opacity="0.6"/>
  </g>

  <!-- Tag & Clue Label -->
  <rect x="15" y="152" width="230" height="35" fill="rgba(10,8,7,0.92)" stroke="url(#goldRim)" stroke-width="1"/>
  <text x="25" y="167" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="#dfbf67">#4: BROKEN GLASS</text>
  <text x="25" y="180" font-family="'Special Elite', monospace" font-size="8" fill="#a09880" letter-spacing="1">LOW • EVIDENCE OF STRUGGLE</text>
