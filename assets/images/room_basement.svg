<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2016"/>
      <stop offset="70%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#554015"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="480" height="240" fill="url(#roomGlow)"/>
  
  <!-- Architectural Perspective Lines -->
  <line x1="0" y1="0" x2="100" y2="60" stroke="rgba(201,168,76,0.15)" stroke-width="1.5"/>
  <line x1="480" y1="0" x2="380" y2="60" stroke="rgba(201,168,76,0.15)" stroke-width="1.5"/>
  <line x1="0" y1="240" x2="100" y2="180" stroke="rgba(201,168,76,0.2)" stroke-width="1.5"/>
  <line x1="480" y1="240" x2="380" y2="180" stroke="rgba(201,168,76,0.2)" stroke-width="1.5"/>
  
  <!-- Interior Room Drawing -->
    <!-- Heavy Stone Archway -->
  <path d="M120,180 L120,80 Q240,20 360,80 L360,180 Z" fill="#0e0c0b" stroke="#4a3e35" stroke-width="3"/>
  <!-- Vault Safe Door -->
  <circle cx="240" cy="115" r="45" fill="#1a1816" stroke="#c9a84c" stroke-width="2.5"/>
  <circle cx="240" cy="115" r="16" fill="#111" stroke="#c9a84c" stroke-width="2"/>
  <!-- Dial Spokes -->
  <line x1="240" y1="99" x2="240" y2="131" stroke="#c9a84c" stroke-width="2"/>
  <line x1="224" y1="115" x2="256" y2="115" stroke="#c9a84c" stroke-width="2"/>
  <!-- Wine Casks in Shadow -->
  <ellipse cx="80" cy="145" rx="28" ry="35" fill="#1b120c" stroke="#332"/>
  <ellipse cx="400" cy="145" rx="28" ry="35" fill="#1b120c" stroke="#332"/>

  <!-- Noir Shadow Vignette Frame -->
  <rect x="6" y="6" width="468" height="228" fill="none" stroke="url(#goldStroke)" stroke-width="1.5"/>
  <rect x="10" y="10" width="460" height="220" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Room Name Overlay Banner -->
  <rect x="25" y="185" width="430" height="42" fill="rgba(8,7,6,0.88)" stroke="url(#goldStroke)" stroke-width="1"/>
  <text x="45" y="206" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="bold" fill="#dfbf67" letter-spacing="2">SECRET BASEMENT</text>
  <text x="45" y="220" font-family="'Special Elite', monospace" font-size="9" fill="#a09880" letter-spacing="1.5">SUBTERRANEAN VAULT • EMBEZZLEMENT CACHE</text>
</svg>