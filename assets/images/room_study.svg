<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2016"/>
      <stop offset="70%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#554015"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="480" height="240" fill="url(#roomGlow)"/>
  
  <!-- Architectural Perspective Lines -->
  <line x1="0" y1="0" x2="100" y2="60" stroke="rgba(201,168,76,0.15)" stroke-width="1.5"/>
  <line x1="480" y1="0" x2="380" y2="60" stroke="rgba(201,168,76,0.15)" stroke-width="1.5"/>
  <line x1="0" y1="240" x2="100" y2="180" stroke="rgba(201,168,76,0.2)" stroke-width="1.5"/>
  <line x1="480" y1="240" x2="380" y2="180" stroke="rgba(201,168,76,0.2)" stroke-width="1.5"/>
  
  <!-- Interior Room Drawing -->
    <!-- Grandfather clock in study corner -->
  <rect x="60" y="50" width="45" height="130" fill="#1b120c" stroke="#c9a84c" stroke-width="1"/>
  <circle cx="82" cy="80" r="14" fill="#f5e6c8" stroke="#221" stroke-width="2"/>
  <line x1="82" y1="80" x2="88" y2="72" stroke="#111" stroke-width="2"/> <!-- 11:13 -->
  <line x1="82" y1="80" x2="89" y2="85" stroke="#111" stroke-width="1.5"/>
  <!-- Mahogany Executive Desk -->
  <polygon points="150,130 330,130 360,180 120,180" fill="#24140b" stroke="#4a2a16" stroke-width="1.5"/>
  <rect x="135" y="180" width="210" height="20" fill="#180e07"/>
  <!-- Leather High-Back Chair (Empty) -->
  <path d="M210,95 Q240,85 270,95 L275,150 L205,150 Z" fill="#1a1310" stroke="#c9a84c" stroke-width="1"/>
  <!-- Desk Lamp Glow -->
  <ellipse cx="170" cy="118" rx="8" ry="5" fill="#4d7c0f"/>
  <path d="M150,130 L190,130 L220,180 L120,180 Z" fill="rgba(255,235,170,0.12)"/>
  <!-- Police Tape Outline on Floor -->
  <path d="M230,155 L255,160 L245,175 L215,170 Z" stroke="#8b3a3a" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- Noir Shadow Vignette Frame -->
  <rect x="6" y="6" width="468" height="228" fill="none" stroke="url(#goldStroke)" stroke-width="1.5"/>
  <rect x="10" y="10" width="460" height="220" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Room Name Overlay Banner -->
  <rect x="25" y="185" width="430" height="42" fill="rgba(8,7,6,0.88)" stroke="url(#goldStroke)" stroke-width="1"/>
  <text x="45" y="206" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="bold" fill="#dfbf67" letter-spacing="2">PRIVATE STUDY</text>
  <text x="45" y="220" font-family="'Special Elite', monospace" font-size="9" fill="#a09880" letter-spacing="1.5">SCENE OF HOMICIDE • CLOCK STOPPED AT 11:13 PM</text>
</svg>