<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#5a451b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="noirGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="380" fill="url(#vignette)"/>
  
  <!-- Outer Vintage Frame -->
  <rect x="8" y="8" width="304" height="364" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="352" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Character Artwork -->
  <g filter="url(#noirGlow)">
      <!-- Silhouette & Hair -->
  <path d="M70,315 C80,240 100,210 120,200 C105,190 95,165 95,135 C95,90 125,60 160,60 C195,60 225,90 225,135 C225,165 215,190 200,200 C220,210 240,240 250,315 Z" fill="#1b1713"/>
  <!-- 1940s Vintage Wave Hair -->
  <path d="M105,130 C90,110 95,75 130,65 C160,55 200,65 220,95 C235,120 225,160 215,175 C205,150 200,105 170,100 C140,95 125,125 105,130 Z" fill="#2d2217"/>
  <!-- Face & Neck Tone -->
  <path d="M125,130 C125,170 140,195 160,195 C180,195 195,170 195,130 C195,115 185,100 160,100 C135,100 125,115 125,130 Z" fill="#d9be9b"/>
  <!-- Shadow side of face (Noir lighting) -->
  <path d="M125,130 C125,170 140,195 160,195 C150,185 145,155 145,125 C145,105 155,100 160,100 C135,100 125,115 125,130 Z" fill="#8f7253" opacity="0.6"/>
  <!-- Eyes & Lips -->
  <ellipse cx="145" cy="132" rx="4" ry="2" fill="#2c1a0e"/>
  <ellipse cx="175" cy="132" rx="4" ry="2" fill="#2c1a0e"/>
  <path d="M152,165 Q160,172 168,165 Q160,175 152,165 Z" fill="#8b3a3a"/>
  <!-- Pearl Necklace -->
  <path d="M138,205 Q160,220 182,205" stroke="#f5e6c8" stroke-width="4" stroke-dasharray="3,4" fill="none"/>
  <!-- Velvet Evening Dress -->
  <path d="M100,230 L160,265 L220,230 L235,315 L85,315 Z" fill="#18131d" stroke="#5a451b" stroke-width="1"/>
  <polygon points="160,205 145,235 175,235" fill="#d9be9b"/>
  </g>

  <!-- Bottom Name Plate -->
  <rect x="20" y="315" width="280" height="46" fill="rgba(10,9,8,0.92)" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <text x="160" y="335" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#dfbf67" text-anchor="middle" letter-spacing="2">ELEANOR BLACKWOOD</text>
  <text x="160" y="351" font-family="'Special Elite', monospace" font-size="9.5" fill="#a09880" text-anchor="middle" letter-spacing="1.5">WIFE • INHERITANCE</text>
  
  <!-- Corner Ornaments -->
  <circle cx="14" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="14" cy="366" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="366" r="3" fill="#c9a84c"/>
</svg>