<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200">
  <defs>
    <radialGradient id="clueBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241d17"/>
      <stop offset="60%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#080705"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#604a18"/>
    </linearGradient>
  </defs>

  <rect width="260" height="200" fill="url(#clueBg)"/>
  <rect x="6" y="6" width="248" height="188" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>
  <rect x="10" y="10" width="240" height="180" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.8" stroke-dasharray="4,2"/>

  <!-- Evidence Artwork -->
  <g transform="translate(0, -10)">
      <circle cx="130" cy="85" r="42" fill="#f5e6c8" stroke="#1c120c" stroke-width="6"/>
  <circle cx="130" cy="85" r="36" fill="none" stroke="#5a3d24" stroke-width="1.5"/>
  <!-- Roman numerals tick marks -->
  <line x1="130" y1="52" x2="130" y2="58" stroke="#111" stroke-width="2"/>
  <line x1="130" y1="118" x2="130" y2="112" stroke="#111" stroke-width="2"/>
  <line x1="97" y1="85" x2="103" y2="85" stroke="#111" stroke-width="2"/>
  <line x1="163" y1="85" x2="157" y2="85" stroke="#111" stroke-width="2"/>
  <!-- Hands pointing strictly to 11:13 -->
  <line x1="130" y1="85" x2="114" y2="58" stroke="#8b3a3a" stroke-width="3"/> <!-- Hour hand to 11 -->
  <line x1="130" y1="85" x2="148" y2="68" stroke="#111" stroke-width="2.5"/> <!-- Minute hand to 13 -->
  <circle cx="130" cy="85" r="3.5" fill="#8b3a3a"/>
  <!-- Brass Jamming Pin -->
  <line x1="140" y1="72" x2="150" y2="62" stroke="#c9a84c" stroke-width="2.5"/>
  </g>

  <!-- Tag & Clue Label -->
  <rect x="15" y="152" width="230" height="35" fill="rgba(10,8,7,0.92)" stroke="url(#goldRim)" stroke-width="1"/>
  <text x="25" y="167" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="#dfbf67">#1: STOPPED CLOCK</text>
  <text x="25" y="180" font-family="'Special Elite', monospace" font-size="8" fill="#a09880" letter-spacing="1">CRITICAL • STAGED AT 11:13 PM</text>
</svg>