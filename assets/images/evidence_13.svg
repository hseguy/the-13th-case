<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200">
  <defs>
    <radialGradient id="clueBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241d17"/>
      <stop offset="60%" stop-color="#120e0a"/>
      <stop offset="100%" stop-color="#080705"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#604a18"/>
    </linearGradient>
  </defs>

  <rect width="260" height="200" fill="url(#clueBg)"/>
  <rect x="6" y="6" width="248" height="188" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>
  <rect x="10" y="10" width="240" height="180" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.8" stroke-dasharray="4,2"/>

  <!-- Evidence Artwork -->
  <g transform="translate(0, -10)">
      <!-- Crystal Ashtray -->
  <ellipse cx="130" cy="95" rx="55" ry="24" fill="#1c2024" stroke="#c9a84c" stroke-width="1.8"/>
  <ellipse cx="130" cy="95" rx="42" ry="16" fill="#121417" stroke="#444" stroke-width="1"/>
  <!-- Cigarette Butts with Gold Filter Tips -->
  <rect x="105" y="90" width="22" height="6" fill="#e8dcbe" transform="rotate(-15, 105, 90)"/>
  <rect x="105" y="90" width="6" height="6" fill="#c9a84c" transform="rotate(-15, 105, 90)"/>
  <rect x="135" y="88" width="24" height="6" fill="#e8dcbe" transform="rotate(25, 135, 88)"/>
  <rect x="153" y="88" width="6" height="6" fill="#c9a84c" transform="rotate(25, 135, 88)"/>
  <!-- Grey Tobacco Ash -->
  <circle cx="128" cy="95" r="4" fill="#666"/>
  <circle cx="134" cy="98" r="3" fill="#888"/>
  <!-- Rising Smoke Wisp -->
  <path d="M112,85 Q110,65 125,50 Q140,35 130,20" stroke="rgba(245,230,200,0.35)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Tag & Clue Label -->
  <rect x="15" y="152" width="230" height="35" fill="rgba(10,8,7,0.92)" stroke="url(#goldRim)" stroke-width="1"/>
  <text x="25" y="167" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="#dfbf67">#13: TURKISH CIGARETTE</text>
  <text x="25" y="180" font-family="'Special Elite', monospace" font-size="8" fill="#a09880" letter-spacing="1">MEDIUM • SMOKED BY VICTOR GRAVES</text>
</svg>