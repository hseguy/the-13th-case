<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#5a451b"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="noirGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="380" fill="url(#vignette)"/>
  
  <!-- Outer Vintage Frame -->
  <rect x="8" y="8" width="304" height="364" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="352" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Character Artwork -->
  <g filter="url(#noirGlow)">
      <!-- Butler Body -->
  <path d="M75,315 C85,245 105,215 125,200 L125,180 L195,180 L195,200 C215,215 235,245 245,315 Z" fill="#0d0e11"/>
  <!-- Head -->
  <path d="M125,120 C125,80 135,68 160,68 C185,68 195,80 195,120 C195,165 182,185 160,185 C138,185 125,165 125,120 Z" fill="#d2b89d"/>
  <!-- Receding Gray Hair -->
  <path d="M123,105 C120,80 130,65 160,65 C190,65 200,80 197,105 C190,85 185,82 175,82 C165,82 160,72 145,72 C135,72 130,85 123,105 Z" fill="#8c857b"/>
  <!-- Spectacles & Calm Expression -->
  <circle cx="145" cy="120" r="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="175" cy="120" r="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <line x1="153" y1="120" x2="167" y2="120" stroke="#c9a84c" stroke-width="1.5"/>
  <ellipse cx="145" cy="120" rx="3" ry="2" fill="#2a1f18"/>
  <ellipse cx="175" cy="120" rx="3" ry="2" fill="#2a1f18"/>
  <line x1="150" y1="158" x2="170" y2="158" stroke="#634835" stroke-width="2"/>
  <!-- Butler Bowtie & Wing Collar -->
  <polygon points="140,180 160,195 180,180 160,185" fill="#f5e6c8"/>
  <path d="M148,190 L160,195 L172,190 L172,202 L160,197 L148,202 Z" fill="#111" stroke="#c9a84c" stroke-width="0.8"/>
  <!-- Formal Vest -->
  <path d="M135,210 L160,250 L185,210 L195,315 L125,315 Z" fill="#1b1c20" stroke="#443" stroke-width="1"/>
  </g>

  <!-- Bottom Name Plate -->
  <rect x="20" y="315" width="280" height="46" fill="rgba(10,9,8,0.92)" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <text x="160" y="335" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#dfbf67" text-anchor="middle" letter-spacing="2">HENRY COLLINS</text>
  <text x="160" y="351" font-family="'Special Elite', monospace" font-size="9.5" fill="#a09880" text-anchor="middle" letter-spacing="1.5">HEAD BUTLER • BLACKMAIL</text>
  
  <!-- Corner Ornaments -->
  <circle cx="14" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="14" r="3" fill="#c9a84c"/>
  <circle cx="14" cy="366" r="3" fill="#c9a84c"/>
  <circle cx="306" cy="366" r="3" fill="#c9a84c"/>
</svg>